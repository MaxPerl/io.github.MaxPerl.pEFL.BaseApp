app-id: io.github.MaxPerl.pEFL.BaseApp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
modules:
  - "shared_modules/luajit.json"
  - name: mtdev
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/rydberg/mtdev.git
        tag: v1.1.5
        commit: 4381b78fea54de0e775bf54952b2f95e5a06c57d
  - name: libevdev
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
      - -Ddocumentation=disabled
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/libevdev/libevdev.git
        tag: libevdev-1.14.0
        commit: d9af2e4580297e9c14715fef06621dd39d9d8a3a 
  - name: libinput
    buildsystem: meson
    config-opts:
      - "-Dlibwacom=false"
      - "-Dtests=false"
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.23.0/libinput-1.23.0.tar.gz
        sha256: 7a7c90fbc59f1f65c781a51fa634e4f79e460bf6e16ad68afbe7965d25d09738
  - name: poppler
    buildsystem: cmake
    config-opts:
      - "-DENABLE_BOOST=OFF"
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-23.08.0.tar.xz
        sha256: 4a4bf7fc903b9f1a2ab7d04b7c5d8220db9bc6261cc73fdb9a826dc272f49aa8
  - name: gs
    buildsystem: simple
    build-commands:
      - ./configure --prefix=${FLATPAK_DEST} --without-tesseract --without-x
      - make soinstall
    build-options:
      cflags: -std=gnu17 -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10012/ghostscript-10.01.2.tar.gz
        sha256: a4cd61a07fec161bee35da0211a5e5cde8ff8a0aaf942fc0176715e499d21661
  - name: libspectre
    buildsystem: autotools
    sources:
      - type: archive
        url: http://libspectre.freedesktop.org/releases/libspectre-0.2.12.tar.gz
        sha256: 55a7517cd3572bd2565df0cf450944a04d5273b279ebb369a895391957f0f960
  - name: efl
    buildsystem: meson
    config-opts:
      - "-Dlua-interpreter=luajit"
      - "-Dbindings="
      - "-Dc_std=gnu17"
      - "-Decore-imf-loaders-disabler=['ibus','scim']"
      - "-Devas-loaders-disabler=['json', 'avif', 'heif','raw']"
      - "-Dbuild-tests=false"
    sources:
      - type: archive
        url: https://download.enlightenment.org/rel/libs/efl/efl-1.28.1.tar.xz
        sha256: 84cf6145f9cc82bfff690005be24392c8f3c52f8e00ff04d8eea371429c09424
      # Patch:
      # Install the Ethumb D-Bus service to /app/share instead of /usr/share
      - type: shell
        commands:
          - sed -i "s|dep.get_pkgconfig_variable('session_bus_services_dir')|join_paths(dir_prefix, 'share/dbus-1/services')|" dbus-services/meson.build
  # Installs Perl.
  # (Based on: https://github.com/flathub/io.github.Hexchat.Plugin.Perl)
  - name: perl
    no-autogen: true
    config-opts:
      - '-des'
      # Build a shared library.
      - '-Duseshrplib'
      - '-Dusethreads'
    build-options:
      cflags: '-fPIC'
      ldflags: '-fpic'
    sources:
      - type: archive
        url: https://www.cpan.org/src/5.0/perl-5.38.2.tar.gz
        sha256: a0a31534451eb7b83c7d6594a497543a54d488bc90ca00f5e34762577f40655e
      - type: script
        dest-filename: 'configure'
        commands:
          - 'exec ./configure.gnu $@'
    # Restore write permission to the Perl libraries.
    post-install:
      - 'chmod -R u+w /app/lib/perl5'
    # Clean up a bunch of stuff we don't need. Depending on your application,
    # you may have to drop some of these (e.g. *.pod).
    cleanup:
      - '/bin/corelist'
      - '/bin/cpan'
      - '/bin/enc2xs'
      - '/bin/encguess'
      - '/bin/h2ph'
      - '/bin/h2xs'
      - '/bin/instmodsh'
      - '/bin/json_pp'
      - '/bin/libnetcfg'
      - '/bin/perlbug'
      - '/bin/perldoc'
      - '/bin/perlivp'
      - '/bin/perlthanks'
      - '/bin/piconv'
      - '/bin/pl2pm'
      - '/bin/pod*'
      - '/bin/prove'
      - '/bin/ptar*'
      - '/bin/shasum'
      - '/bin/splain'
      - '/bin/xsubpp'
      - '/bin/zipdetails'
      - '/man'
      - '*.pod'
  # Installs the modules generated by flatpak-cpan-generator.
  # Note that *any* Makefile.PL-style modules MUST be installed in this one step,
  # as once perllocal.pod is written in one module, it cannot be modified by others.
  - name: perl-libs
    buildsystem: simple
    build-commands:
      - 'perl-libs/install.sh'
    # Same as with the Perl module, we need to restore write permission.
    # However, -f is now passed to avoid errors from trying to touch files from the
    # above module that are now marked as read-only.
    post-install:
      - 'chmod -Rf u+w /app/lib/perl5/site_perl'
    sources:
      - generated-sources.json
    # This step should be customized based on the CPAN packages you're using.
    cleanup:
      - '/bin'
      - '/man'
  # If users install XS-modules in a Flaptak based on this Flatpak, 
  # they have to call fix-perl-perms in post-install stage 
  #
  # "make install" puts compiled XS libraries read-only (mode 0555) files. 
  # After each module's build, flatpak-builder runs eu-strip on them to split 
  # off debug symbols, which modifies the file and therefore
  # needs write permission. Without this step the build
  # fails with "eu-strip: ... Permission denied".
  - name: fix-perl-perms
    buildsystem: simple
    build-commands:
      - install -Dm755 fix-perl-perms.sh /app/bin/fix-perl-perms
    sources:
      - type: script
        dest-filename: fix-perl-perms.sh
        commands:
          - 'find /app/lib/perl5 -type f ! -perm -u+w -exec chmod u+w {} + || true'
cleanup:
  - '/include'
  - '*.a' 
  - '/share/doc'
  - '/share/man'